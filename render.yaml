databases:
  - name: vibe-todo-db
    databaseName: todo_db
    user: vibe_user
    plan: free
    region: singapore # optional, or allow auto

services:
  - type: web
    name: vibe-todo-server
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: node index.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vibe-todo-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.11.0
